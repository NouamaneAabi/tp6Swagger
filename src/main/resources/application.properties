# ==============================================================================
# Configuration de la source de donnees MySQL
# ==============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/studentdb?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# Configuration JPA / Hibernate
# ==============================================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==============================================================================
# Configuration Springdoc OpenAPI / Swagger UI
# ==============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ==============================================================================
# Format des dates pour les requetes/reponses JSON
# ==============================================================================
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
